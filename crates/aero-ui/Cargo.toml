[package]
name = "aero-ui"
version = "0.1.0"
edition = "2021"
authors = ["Md. Firoze Hossain <firoze.hossain@outlook.com>"]
description = "Sleek, modern browser UI component library featuring multi-tab strip, Omnibox, Brave Shields dashboard, and Reader view."
license = "MIT"
repository = "https://github.com/firoze-hossain/aero-browser"

[features]
default = ["std"]
std = ["aero-engine/std", "dep:minreq"]

[dependencies]
aero-engine = { path = "../aero-engine", default-features = false }
minreq = { version = "3.0", features = ["https-rustls"], optional = true }
